# /etc/nginx/sites-available/firefly-api
#
# The server itself binds 127.0.0.1 and holds no auth logic; TLS and the bearer
# token both live here. Open 443 only in the Oracle security list and, if the VM
# runs one, in iptables/firewalld as well - Oracle images ship with the local
# firewall closed by default, which is the usual reason a correct security list
# rule still times out.
#
# Replace REPLACE_WITH_TOKEN with a long random string:  openssl rand -hex 32

map $http_authorization $firefly_authorised {
    default                        0;
    "Bearer REPLACE_WITH_TOKEN"    1;
}

# Browser clients only. A page served from another origin - the web/ frontend on
# a static host - cannot read this API without an explicit allow, and curl and
# the SSH tunnel never consult it. Echo back only origins you actually run;
# "*" together with a bearer token in the page would let any site spend it.
# Leave this empty and CORS stays off, which is the right setting if the only
# clients are curl and a Vite dev proxy.
map $http_origin $cors_origin {
    default                        "";
    # "https://tashtego.example.com"  $http_origin;
    # "http://localhost:5173"         $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # Created by: certbot certonly --standalone -d api.example.com
    # See ../DEPLOY.md section 12 - get the certificate before enabling
    # this config, or nginx will not start.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # An action list plus a board is a few hundred bytes.
    client_max_body_size 64k;

    location / {
        # The preflight must be answered before the token check: browsers send
        # OPTIONS without credentials, so a 401 here would fail the real request
        # with a CORS error that names no cause.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length               0;
            return 204;
        }

        # always, so the header survives the 401 below - without it the browser
        # reports a CORS failure instead of the authentication error.
        add_header Access-Control-Allow-Origin $cors_origin always;

        if ($firefly_authorised = 0) {
            return 401 '{"error":"missing or invalid bearer token"}';
        }
        default_type application/json;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # The upstream already gzips when the client asks for it, so nginx must
        # not compress the response a second time.
        gzip off;
    }
}
